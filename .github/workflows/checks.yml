name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # PyYAML lets the syntax-definition check run instead of skipping.
          python-version: '3.x'

      - name: Install test dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Run checks
        run: python -m tests.run

      - name: Confirm nothing stray is tracked
        run: |
          # Package Control zips the whole tree, so Windows alternate-stream
          # artifacts and bytecode must never reach a release.
          if git ls-files | grep -Ei 'Zone.Identifier$|__pycache__|\.py[co]$'; then
            echo "Stray files are tracked in the package:"
            git ls-files | grep -Ei 'Zone.Identifier$|__pycache__|\.py[co]$'
            exit 1
          fi
          echo "clean"

      - name: Confirm the package root has no nested packages dir
        run: |
          # Tag-based GitHub hosting installs the repo root as the package, so
          # a packages/ subdirectory would ship a package inside a package.
          if [ -d packages ]; then
            echo "packages/ exists; the package must live at the repo root"
            exit 1
          fi
          echo "clean"